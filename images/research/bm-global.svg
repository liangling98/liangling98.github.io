<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">Factorized descent with global safeguards</title><desc id="desc">Conceptual cycle combining cheap Burer–Monteiro steps, aperiodic inexact proximal steps on the original convex objective, and adaptive rank selection.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5cad"/></marker></defs>
<rect width="600" height="280" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="28" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="600">Fast factorized steps + a convex safeguard</text><rect x="30" y="79" width="230" height="88" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="145.0" y="117.14999999999999" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">Low-rank BM steps</text><text x="145.0" y="141.45" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">in factor space</text><rect x="340" y="79" width="230" height="88" rx="8" fill="#f1faf8" stroke="#168277" stroke-width="1.5"/><text x="455.0" y="117.47500000000001" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">Inexact proximal step</text><text x="455.0" y="140.425" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">on the convex problem</text><line x1="263" y1="111" x2="336" y2="111" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="88" font-size="15" fill="#5c6b77" text-anchor="middle" font-weight="400">periodic</text><path d="M455 170 L455 215 L145 215 L145 172" fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="242" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">Adaptive rank · global convergence guarantees</text></g></svg>