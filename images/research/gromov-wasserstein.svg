<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">Gromov–Wasserstein matches within-space relations</title><desc id="desc">Illustrative three-point spaces with equal pairwise distances under a rigid transformation. Gromov–Wasserstein compares relations within each space rather than requiring shared coordinates.</desc>
