<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">Second-order cone geometry and ALM convergence</title><desc id="desc">An illustrative second-order cone beside the connection between quadratic-growth conditions and R-superlinear KKT-residual convergence of ALM.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5cad"/></marker></defs>
<rect width="600" height="280" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="30" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="600">Cone geometry informs the convergence theory</text><path d="M46 84 L143 225 L240 84" fill="#f3f8fd" stroke="#0b5cad" stroke-width="2"/><ellipse cx="143" cy="84" rx="97" ry="28" fill="#f3f8fd" stroke="#0b5cad" stroke-width="2"/><text x="144" y="151" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="400">‖x‖₂ ≤ t</text><rect x="290" y="63" width="276" height="62" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="428.0" y="99.95" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">Quadratic-growth conditions</text><line x1="428" y1="129" x2="428" y2="153" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><rect x="290" y="157" width="276" height="64" rx="8" fill="#f1faf8" stroke="#168277" stroke-width="1.5"/><text x="428.0" y="183.475" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">ALM residuals converge</text><text x="428.0" y="206.425" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">R-superlinearly</text><text x="300" y="261" font-size="15" fill="#5c6b77" text-anchor="middle" font-weight="400">Under the paper’s stated regularity assumptions</text></g></svg>