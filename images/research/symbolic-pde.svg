<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">LLM-guided symbolic PDE solution pipeline</title><desc id="desc">Schematic flow from symbolic PDE and boundary information to predicted solution operators and a symbolic solver that constructs an analytical approximation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5cad"/></marker></defs>
<rect width="600" height="280" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="29" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="600">Predict symbolic structure before searching</text><rect x="18" y="83" width="173" height="97" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="104.5" y="125.64999999999999" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">PDE +</text><text x="104.5" y="149.95" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">boundary data</text><rect x="225" y="83" width="149" height="97" rx="8" fill="#f1faf8" stroke="#168277" stroke-width="1.5"/><text x="299.5" y="125.64999999999999" font-size="18" fill="#168277" text-anchor="middle" font-weight="400">LLM predicts</text><text x="299.5" y="149.95" font-size="18" fill="#168277" text-anchor="middle" font-weight="400">operators</text><rect x="408" y="83" width="174" height="97" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="495.0" y="126.3" font-size="16" fill="#0b5cad" text-anchor="middle" font-weight="400">Symbolic solver</text><text x="495.0" y="147.9" font-size="16" fill="#0b5cad" text-anchor="middle" font-weight="400">approximate solution</text><line x1="194" y1="131" x2="221" y2="131" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><line x1="377" y1="131" x2="404" y2="131" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="223" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">An interpretable pipeline for PDE solutions</text></g></svg>