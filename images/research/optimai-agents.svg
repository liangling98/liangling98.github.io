<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">The four roles in OptimAI</title><desc id="desc">A simplified diagram of the formulator, planner, coder, and code critic, with a feedback loop from the critic to the coder. Based on Figure 1 of OptimAI.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5cad"/></marker></defs>
<rect width="600" height="280" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="29" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="600">From a problem description to executable code</text><rect x="16" y="86" width="125" height="86" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="78.5" y="123.47500000000001" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">Formulator</text><text x="78.5" y="146.425" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">math model</text><rect x="164" y="86" width="125" height="86" rx="8" fill="#f3f8fd" stroke="#168277" stroke-width="1.5"/><text x="226.5" y="123.47500000000001" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">Planner</text><text x="226.5" y="146.425" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">strategy</text><rect x="312" y="86" width="125" height="86" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="374.5" y="123.47500000000001" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">Coder</text><text x="374.5" y="146.425" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">program</text><rect x="460" y="86" width="125" height="86" rx="8" fill="#f3f8fd" stroke="#168277" stroke-width="1.5"/><text x="522.5" y="123.47500000000001" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">Code critic</text><text x="522.5" y="146.425" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">feedback</text><line x1="144" y1="129" x2="160" y2="129" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><line x1="292" y1="129" x2="308" y2="129" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><line x1="440" y1="129" x2="456" y2="129" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><path d="M523 175 L523 221 L375 221 L375 176" fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="298" y="260" font-size="17" fill="#5c6b77" text-anchor="middle" font-weight="400">Execute, inspect, and refine</text></g></svg>