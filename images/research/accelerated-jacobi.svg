<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">Parallel accelerated Jacobi updates</title><desc id="desc">Schematic parallel Jacobi block updates followed by momentum; the rate refers to the associated quadratic objective under the paper assumptions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5cad"/></marker></defs>
<rect width="600" height="280" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="28" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="600">Parallel updates with Nesterov acceleration</text><rect x="28" y="58" width="162" height="61" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="109.0" y="94.8" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">Row block 1</text><line x1="109" y1="122" x2="300" y2="155" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><rect x="218" y="58" width="162" height="61" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="299.0" y="94.8" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">Row block 2</text><line x1="299" y1="122" x2="300" y2="155" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><rect x="408" y="58" width="162" height="61" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="489.0" y="94.8" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">Row block 3</text><line x1="489" y1="122" x2="300" y2="155" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="159" width="260" height="53" rx="8" fill="#f1faf8" stroke="#168277" stroke-width="1.5"/><text x="300.0" y="191.45" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">Jacobi update + momentum</text><text x="300" y="249" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">O(1/k²) quadratic-objective convergence</text></g></svg>