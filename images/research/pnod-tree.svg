<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">Efficient continuous relaxations inside branch-and-bound</title><desc id="desc">Schematic branch-and-bound tree for exact experimental design. Projected Newton and vertex exchange accelerate the continuous relaxation solved at each node.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5cad"/></marker></defs>
<rect width="600" height="280" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="28" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="600">Projected Newton solves the tree’s relaxations</text><rect x="190" y="49" width="220" height="54" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="300.0" y="81.95" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">Continuous relaxation</text><line x1="237" y1="106" x2="146" y2="148" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><line x1="363" y1="106" x2="454" y2="148" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><rect x="58" y="151" width="179" height="51" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="147.5" y="182.45" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">wᵢ ≤ floor(v)</text><rect x="363" y="151" width="179" height="51" rx="8" fill="#f1faf8" stroke="#168277" stroke-width="1.5"/><text x="452.5" y="182.45" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">wᵢ ≥ ceil(v)</text><line x1="147" y1="204" x2="102" y2="225" stroke="#a6b8c6" stroke-width="2"/><circle cx="102" cy="233" r="8" stroke="#0b5cad" stroke-width="2" fill="#f3f8fd"/><line x1="147" y1="204" x2="192" y2="225" stroke="#a6b8c6" stroke-width="2"/><circle cx="192" cy="233" r="8" stroke="#0b5cad" stroke-width="2" fill="#f3f8fd"/><line x1="453" y1="204" x2="408" y2="225" stroke="#a6b8c6" stroke-width="2"/><circle cx="408" cy="233" r="8" stroke="#0b5cad" stroke-width="2" fill="#f3f8fd"/><line x1="453" y1="204" x2="498" y2="225" stroke="#a6b8c6" stroke-width="2"/><circle cx="498" cy="233" r="8" stroke="#0b5cad" stroke-width="2" fill="#f3f8fd"/><text x="300" y="268" font-size="16" fill="#5c6b77" text-anchor="middle" font-weight="400">Branch-and-bound for integer design allocations</text></g></svg>