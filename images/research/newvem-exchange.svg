<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">A feasible vertex-exchange example</title><desc id="desc">Illustrative simplex weights change from 0.50, 0.30, 0.20 to 0.35, 0.45, 0.20. The exchange preserves total mass and nonnegativity; it is not a measured optimization run.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5cad"/></marker></defs>
<rect width="600" height="280" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="29" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="600">Exchange weights while preserving feasibility</text><rect x="32" y="112.0" width="46" height="105.0" rx="3" fill="#0b5cad"/><text x="55" y="102.0" font-size="16" fill="#0b5cad" text-anchor="middle" font-weight="400">0.50</text><rect x="105" y="154.0" width="46" height="63.0" rx="3" fill="#168277"/><text x="128" y="144.0" font-size="16" fill="#168277" text-anchor="middle" font-weight="400">0.30</text><rect x="178" y="175.0" width="46" height="42.0" rx="3" fill="#91a4b5"/><text x="201" y="165.0" font-size="16" fill="#91a4b5" text-anchor="middle" font-weight="400">0.20</text><text x="128" y="247" font-size="17" fill="#5c6b77" text-anchor="middle" font-weight="400">before</text><rect x="344" y="143.5" width="46" height="73.5" rx="3" fill="#0b5cad"/><text x="367" y="133.5" font-size="16" fill="#0b5cad" text-anchor="middle" font-weight="400">0.35</text><rect x="417" y="122.5" width="46" height="94.5" rx="3" fill="#168277"/><text x="440" y="112.5" font-size="16" fill="#168277" text-anchor="middle" font-weight="400">0.45</text><rect x="490" y="175.0" width="46" height="42.0" rx="3" fill="#91a4b5"/><text x="513" y="165.0" font-size="16" fill="#91a4b5" text-anchor="middle" font-weight="400">0.20</text><text x="440" y="247" font-size="17" fill="#5c6b77" text-anchor="middle" font-weight="400">after</text><line x1="263" y1="155" x2="326" y2="155" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="112" font-size="16" fill="#5c6b77" text-anchor="middle" font-weight="400">shift</text><text x="300" y="135" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">0.15</text></g></svg>