<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">The two phases of QPPAL</title><desc id="desc">Phase I generates a low-to-medium accuracy warm start using symmetric Gauss–Seidel updates. Phase II uses proximal augmented Lagrangian iterations for an accurate solution.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5cad"/></marker></defs>
<rect width="600" height="280" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="30" font-size="19" fill="#0b5cad" text-anchor="middle" font-weight="600">Warm start first, then refine to high accuracy</text><rect x="24" y="73" width="239" height="126" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="143.5" y="118.0" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">PHASE I</text><text x="143.5" y="142.3" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">symmetric Gauss–Seidel</text><text x="143.5" y="166.6" font-size="18" fill="#0b5cad" text-anchor="middle" font-weight="400">low / medium accuracy</text><rect x="337" y="73" width="239" height="126" rx="8" fill="#f1faf8" stroke="#168277" stroke-width="1.5"/><text x="456.5" y="118.0" font-size="18" fill="#168277" text-anchor="middle" font-weight="400">PHASE II</text><text x="456.5" y="142.3" font-size="18" fill="#168277" text-anchor="middle" font-weight="400">proximal ALM</text><text x="456.5" y="166.6" font-size="18" fill="#168277" text-anchor="middle" font-weight="400">high accuracy</text><line x1="268" y1="136" x2="330" y2="136" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="244" font-size="17" fill="#5c6b77" text-anchor="middle" font-weight="400">Two phases for high-dimensional convex QP</text></g></svg>