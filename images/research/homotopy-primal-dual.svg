<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
<title id="title">A primal-dual-primal homotopy framework</title><desc id="desc">Schematic of dualizing a primal problem, applying homotopy proximal Newton in the dual, then solving the subproblem back in primal space to exploit regularizer-induced structure.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#0b5cad"/></marker></defs>
<rect width="600" height="280" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="300" y="30" font-size="22" fill="#0b5cad" text-anchor="middle" font-weight="600">Primal → dual → primal</text><rect x="18" y="86" width="160" height="91" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="98.0" y="125.97500000000001" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">Original</text><text x="98.0" y="148.925" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">primal problem</text><rect x="220" y="86" width="160" height="91" rx="8" fill="#f3f8fd" stroke="#168277" stroke-width="1.5"/><text x="300.0" y="125.97500000000001" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">Homotopy Newton</text><text x="300.0" y="148.925" font-size="17" fill="#168277" text-anchor="middle" font-weight="400">on the dual</text><rect x="422" y="86" width="160" height="91" rx="8" fill="#f3f8fd" stroke="#0b5cad" stroke-width="1.5"/><text x="502.0" y="125.97500000000001" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">Structured</text><text x="502.0" y="148.925" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">primal subproblem</text><line x1="181" y1="131" x2="216" y2="131" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><line x1="383" y1="131" x2="418" y2="131" stroke="#0b5cad" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="226" font-size="17" fill="#5c6b77" text-anchor="middle" font-weight="400">Keep the structure promoted by the regularizer</text><text x="300" y="252" font-size="17" fill="#0b5cad" text-anchor="middle" font-weight="400">Covariance example: no matrix inversion</text></g></svg>